[package]
name = "shared"
version = "0.1.0"
edition = "2024"

# Types shared between the native web server (in the root `agent` crate) and the Leptos
# web UI (`crates/web-ui`), so the wire format between them is defined exactly once and
# cannot drift between the two sides. Deliberately dependency-light: anything added here
# must compile for both a native target and `wasm32-unknown-unknown`.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
