[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-openai = { version = "0.41", features = ["chat-completion"] }
async-stream = "0.3.6"
async-trait = "0.1.91"
backon = "1.6.0"
chrono = "0.4.45"
dotenvy = "0.15.7"
futures = "0.3.33"
reqwest = { version = "0.13.4", features = ["json"] }
rmcp = { version = "3.1.1", features = ["client", "server", "macros", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.24.0", features = ["v4"] }
