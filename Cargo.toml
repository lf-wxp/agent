[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-openai = { version = "0.41", features = ["chat-completion"] }
async-stream = "0.3.6"
backon = "1.6.0"
dotenvy = "0.15.7"
futures = "0.3.33"
reqwest = { version = "0.13.4", features = ["json"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
