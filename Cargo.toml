[package]
edition = "2024"
name = "agent"
version = "0.3.0"

# This crate is both a regular Cargo package (native, tokio/axum-based) and the root of a
# workspace whose other members target `wasm32-unknown-unknown` (the Leptos web UI, see
# `crates/web-ui`) — Cargo supports a package directory doubling as the workspace root, so
# nothing under `src/`/`examples/` needs to move. Kept as a separate resolver so native and
# wasm members can pick different feature sets for shared dependencies instead of unifying
# them across targets (the default behavior that used to cause wasm builds to accidentally
# pull in native-only features).
[workspace]
members = ["crates/shared", "crates/web-ui"]
resolver = "2"

[dependencies]
anyhow = "1.0.104"
# `byot` adds raw-JSON variants of the chat calls (`create_byot` / `create_stream_byot`),
# which is how `llm::backend` reads the non-standard `reasoning_content` field that the
# typed responses have no slot for, and writes it back on replayed assistant messages.
# Caveat: the feature is crate-wide, and with it on the *typed* `chat().create()` /
# `create_stream()` no longer check or set `stream` themselves (`async-openai` compiles
# that out). Nothing here calls them: `OpenAiCompatible` is the one place that talks to
# the client, and sets `stream` itself. Keep it that way.
async-openai = { version = "0.42.2", features = ["byot", "chat-completion", "embedding"] }
async-stream = "0.3.6"
async-trait = "0.1.92"
axum = "0.8.9"
backon = "1.6.0"
base64 = "0.23.1"
chrono = "0.4.45"
crossterm = "0.29.0"
csv = "1.4.0"
dotenvy = "0.15.7"
futures = "0.3.34"
reedline = "0.52.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json"] }
rmcp = { version = "3.5.1", features = [
  "client",
  "server",
  "macros",
  "transport-child-process",
  "transport-io",
  "transport-streamable-http-client-reqwest",
  # Server side of Streamable HTTP: only the `mcp_http_*` examples need it, but Cargo
  # features are per-package rather than per-target, so it is enabled here.
  "transport-streamable-http-server",
] }
schemars = "1.2.3"
# The persistent vector store (`knowledge_base::store`) and long-term memory (`memory`),
# behind the `sqlite` feature (on by default). `bundled` compiles SQLite from source, so
# nothing has to be installed on the machine and every build gets the same SQLite version
# — at the cost of a C compiler and a slower first build. A library consumer that only
# wants the agent loop can turn it off with `default-features = false` and skip the whole
# tree.
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shared = { path = "crates/shared" }
tiktoken-rs = "0.12.1"
tokio = { version = "1.53.3", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  # `run_command` spawns a shell child process.
  "process",
  "rt-multi-thread",
  # `Ctrl-C` at an approval prompt has to wind the turn down rather than take it with
  # the process — see `spawn_interrupt_handler` in `src/bin/cli/main.rs`.
  "signal",
  "sync",
  "time",
] }
tokio-util = "0.7.20"
tower-http = { version = "0.7.1", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# OpenTelemetry export (`--features otel`). Optional because it is a sizeable dependency
# tree that only a deployment shipping traces to a collector needs; the spans themselves
# are plain `tracing` spans and exist either way. OTLP over HTTP with the blocking client,
# which is what the SDK's batch processor (its own thread) is meant to be paired with —
# no gRPC stack, and no dependence on the caller's async runtime.
opentelemetry = { version = "0.33.0", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = [
  "http-proto",
  "reqwest-blocking-client",
  "trace",
], optional = true }
tracing-opentelemetry = { version = "0.34.0", optional = true }
uuid = { version = "1.28.0", features = ["v4"] }
walkdir = "2.5.0"
zip = "9.0"

# `run_command` signals its child's whole process group, which std/tokio do not expose.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[features]
default = ["sqlite"]
# The persistent vector store and long-term memory (`knowledge_base::store`, `memory`,
# `tools::retrieve`). On by default because the `cli` binary and the `rag` example build
# on it; off means the crate has no SQLite dependency at all, and those two targets are
# not built.
sqlite = ["dep:rusqlite"]
# Export spans over OTLP/HTTP when `OTEL_EXPORTER_OTLP_ENDPOINT` is set; see
# `telemetry`'s module docs.
otel = [
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
  "dep:tracing-opentelemetry",
]

# The `cli` binary needs the vector store; so does the `rag` example. Cargo's
# `required-features` is what keeps `--no-default-features` a working build rather than a
# pile of unresolved imports.
[[bin]]
name = "cli"
path = "src/bin/cli/main.rs"
required-features = ["sqlite"]

[[example]]
name = "rag"
required-features = ["sqlite"]

[profile.release]
codegen-units = 1
lto = "thin"

# Wasm bundle size matters for a page load in a way it does not for the native binary;
# optimize `web-ui` (and its dependency tree) for size instead of speed within the same
# workspace-wide `release` profile above. Cargo only allows a handful of settings to vary
# per package this way (`opt-level` is one of them); `lto`/`codegen-units` stay
# workspace-wide.
[profile.release.package.web-ui]
opt-level = "z"
